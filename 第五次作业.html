<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第五次作业
</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #ff0844, #ffb199);
}
.box1 {
    width: 220px;
    height: 220px;
    background: linear-gradient(180deg, #00c6ff, #0072ff);
    border-radius: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.box2 {
    width: 160px;
    height: 160px;
    background: #000;
    border-radius: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.box3 {
    width: 110px;
    height: 110px;
    background: linear-gradient(180deg, #fdfbfb, #ebedee);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}
.triangle {
    width: 0;
    height: 0;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-left: 22px solid #000;
    margin-left: 5px;
}
</style>
</head>
<body>
<div class="box1">
    <div class="box2">
        <div class="box3">
            <div class="triangle"></div>
        </div>
    </div>
</div>
</body>
</html>
