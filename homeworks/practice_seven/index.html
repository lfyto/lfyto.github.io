<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>作业七——用户注册</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: whitesmoke;
        }

        .the_first {
            min-height: 100vh;
            background-color: white;
        }

        .the_second {
            height: 120px;
            background-color: #8ef3db;
            color: rgb(155, 35, 35);
            text-align: center;
            line-height: 45px;
            font-size: 60px;
            letter-spacing: 150px;
        }
         .the_third {
            background-color: #3f6850;
            padding: 12px 15px;
            margin-bottom: 20px;
            line-height: 2;
        }
        .my_text {
            background-color: #b0f0db;
            padding: 25px;
        }

        .my_table {
            width: 100%;
        }
        .my_table td {
            padding: 10px 0;
            line-height: 1.8;
        }

        .my_label {
            width: 28%;
            white-space: nowrap;
            vertical-align: middle;
        }

        .my_picture {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 6px;
        }

        .my_table input {
            width: 100%;
            height: 28px;
            border: 1px solid #b0efe0;
        }
        .the_last {
            width: 140px;
            height: 32px;
            background-color: #d8f1ef;
            color: #d8b3f3;
            border: none;
            
        }

    </style>
</head>
<body>

<div class="the_first">
    <div class="the_second">网上书城</div>

    <div class="my_text">
        <div class="the_third">+ 注册新用户</div>

        <form>
            <table class="my_table">




                <tr>
                    <td class="my_label">
                        <img class="my_picture" src="用户.jpg">
                        用户名
                    </td>
                    <td><input type="text"></td>
                </tr>





                
                <tr>
                    <td class="my_label">
                        <img class="my_picture" src="密码和确认密码.jpg">
                        密　码
                    </td>
                    <td><input type="password"></td>
                </tr>



                <tr>
                    <td class="my_label">
                        <img class="my_picture" src="密码和确认密码.jpg">
                        确认密码
                    </td>
                    <td><input type="password"></td>
                </tr>




                <tr>
                    <td class="my_label">
                        <img class="my_picture" src="电子邮件.jpg">
                        电子邮件
                    </td>
                    <td><input type="text"></td>
                </tr>




                <tr>
                    <td colspan="2" align="center" style="padding-top:15px;">
                        <input type="submit" value="注册新用户" class="the_last">
                    </td>
                </tr>




            </table>
        </form>
    </div>
</div>

</body>
</html>
