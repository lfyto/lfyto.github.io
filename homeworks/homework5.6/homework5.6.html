<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>如何培养认真严谨的习惯</title>


<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #fff;
        padding: 40px;
        color: #333;
    }

    .container {
        max-width: 1200px;
        margin-left: -60px;
        margin-right: auto;
    }

    .content-wrapper {
        display: flex;
        gap: 60px;
        align-items: stretch;
    }

    .left-image {
        flex: 0 0 440px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 80px;   
    }

    .left-image img {
        width: 120%;
        height: 120%;
        object-fit: contain;
        display: block;
    }

    .right-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

 
    .main-title {
        text-align: center;
        font-family: 'Ma Shan Zheng', cursive; 
        font-size: 42px;
        font-weight: bold;
        margin-bottom: 30px;
        letter-spacing: 2px; 
    }

    .main-title span {
        color: #2E5C8A;
        font-family: 'Ma Shan Zheng', cursive; 
    }

    .info-bar {
        text-align: center;
        font-size: 15px;
        margin-bottom: 35px;
    }

    .info-bar .gray {
        color: #999;
    }

    .info-bar .blue {
        color: #2E5C8A;
        margin: 0 8px;
    }

    .custom-list {
        list-style: none;
        padding-left: 0;
        margin: 0;
    }

    .custom-list li {
        position: relative;
        padding-left: 28px;
        margin-bottom: 22px;
        font-size: 16px;
        line-height: 1.8;
        white-space: nowrap;
    }

    .custom-list li::before {
        content: "♠";
        position: absolute;
        left: 0;
        top: 2px;
        font-size: 18px;
        font-weight: bold;
    }

    .highlight-red {
        color: #E60012;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-wrapper">

        <div class="left-image">
            <img src="image.jpg" alt="态度决定一切 细节决定成败">
        </div>

        <div class="right-content">
            <h1 class="main-title">如何培养<span>认真严谨</span>的习惯</h1>

            <div class="info-bar">
                <span class="gray">时间：</span><span class="blue">2022年02月21日17时26分</span>
                &nbsp;&nbsp;&nbsp;
                <span class="gray">来源：</span><span class="blue">思政教育</span>
            </div>

            <ul class="custom-list">
                <li><span class="highlight-red">反复确认</span>，做任何事情都要照顾到每一个细节并反复确认，<span class="highlight-red">要有一种始在脑子里“虚拟”整个事件过程的第力</span>，确保所有的节点都正常。</li>
                <li>想尽办法<span class="highlight-red">努力让不可能变为可能</span>只有佣会全力做了，才算是努力。</li>
                <li>结果导向<span class="highlight-red">一切以结果为导向，任何事情都是你的名片。</span>还要思考你的结果和过程是否满足所有和你配合的人的需求。</li>
                <li>学会假设<span class="highlight-red">了解周围比你强的人，观察他们的做事方法。</span>遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做。</li>
            </ul>
        </div>

    </div>
</div>

</body>
</html>
