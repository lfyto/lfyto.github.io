<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Layout</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: white; }

        .mybackground {
            width: 800px;
            height: 360px;
            position: absolute;
            top: 100px;
            left: 450px;
            overflow: hidden;
            background: #ffffff;}
        




        .mybackground > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .theleft, .therigth {
            position: absolute;
            top: 50%;
            width: 40px;
            height: 40px;
            margin-top: -20px;  
        }
        .theleft { left: 20px; }
        .therigth { right: 20px; }
        .theleft img, .therigth img { width: 100%; height: 100%; }

        .one, .two, .three, .four {
            position: absolute;
            width: 12px;
            height: 12px;
            bottom: 20px;       
            z-index: 10;}
        
       
        .one { left: 376px; }  
        .two { left: 400px; }  
        .three { left: 424px; }
        .four { left: 448px; } 
        .one img, .two img, .three img, .four img { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="mybackground">
        <img src="banner1.jpg" alt="Banner">
        <div class="theleft"><img src="arrow1.png" alt="Left"></div>
        <div class="therigth"><img src="arrow2.png" alt="Right"></div>
        <div class="one"><img src="point1.png" alt="Dot"></div>
        <div class="two"><img src="point1.png" alt="Dot"></div>
        <div class="three"><img src="point1.png" alt="Dot"></div>
        <div class="four"><img src="point2.png" alt="Dot"></div>
    </div>
</body>
</html>
